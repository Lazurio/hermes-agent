name: Lazurio Fork CI

# Read-only CI for the Lazurio overlay on upstream Hermes Agent: on pull requests, on main, by hand
# and inside every release run (workflow_call), always on one exact source commit. Upstream's own
# workflows cut and publish upstream releases and need upstream runners and secrets; they stay
# disabled in this repository's Actions settings. Runbook: docs/operations/lazurio-fork-release.md.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit to test
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-fork-ci-${{ github.event_name }}-${{ inputs.source_sha || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_TAG: v0.22.4
  UPSTREAM_SHA: 4d04303818b61bf3aa09278af48356315515965b
  UPSTREAM_REPOSITORY: https://github.com/NousResearch/hermes-agent.git
  SOURCE_REF: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

jobs:
  guard:
    name: Overlay guard and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch exact source and upstream base without credentials
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          git init -q .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --quiet --filter=blob:none --no-tags source "$SOURCE_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

          # Upstream tags are annotated: the base is the tag's peeled commit, never the tag object.
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --quiet --filter=blob:none --no-tags upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test "$(git rev-list --merges "$UPSTREAM_SHA..HEAD" --count)" = 0

      - name: Overlay changes only allowed upstream files
        run: |
          set -euo pipefail
          # Upstream files whose content the overlay changes, grouped by the overlay row that owns
          # them. Each entry is a reviewed decision with its reason; new Lazurio files need no entry.
          # Changing the content of any other upstream file fails. The distribution row adds only
          # Lazurio files.
          allowed_upstream_changes=(
            # acp: fast mode session config option on the gateway viewer. The viewer mixes in
            # acp_adapter/lazurio_config_options.py: its session replies carry the option,
            # set_config_option runs it and answers with the options last shown, and its snapshot
            # adoption, session.info projection and post-attach notices refresh them from the owner.
            # acp: clarify for an ACP editor that answers form elicitation (listed below too): the
            # viewer's session/new asks for it with editor.lazurio_form_elicitation when the owner
            # advertises it.
            # acp: session/resume attaches without replaying history: _resume replays only for
            # session/load.
            # acp: after the editor's Stop, its next prompt carries the interrupted request: the
            # viewer mixes in acp_adapter/lazurio_stop_and_send.py, which prompt and _cancel_admission
            # call.
            # acp: a reply of intentional silence (NO_REPLY, [SILENT]) sends nothing to the client
            # (listed below too): the viewer mixes in acp_adapter/lazurio_silence.py, which its
            # message.delta projection, segment boundaries, replay-gap cut and teardown call.
            # acp: a turn's commands see the LAZURIO_BUDDY_CHANNEL of the ACP viewer that submitted
            # it (listed below too): _client reads the field from this process's environment and the
            # owner's runtime.describe through gateway/lazurio_buddy_channel.py, and prompt sends it.
            # acp: a message sent while Buddy works steers his running turn, never stops it: the viewer
            # mixes in acp_adapter/lazurio_active_steer.py, which answers _lazurio/steer, initialize
            # lists lazurio.activeSteer in the agent capabilities' _meta, and prompt hands the turn
            # id of its _meta (lazurio.turnId) to _lazurio_note_turn first.
            acp_adapter/gateway_server.py
            # acp: hermes acp --check also checks the MCP SDK: _run_check calls
            # acp_adapter/lazurio_check.py.
            acp_adapter/entry.py
            # acp: a reply of intentional silence (NO_REPLY, [SILENT]) sends nothing to the client:
            # _finish_reply, shared by message.complete and a retry's terminal receipt, settles the
            # reply through acp_adapter/lazurio_silence.py.
            acp_adapter/gateway_reply.py
            # acp: clarify for an ACP editor that answers form elicitation. The owner advertises the
            # key (session_controls.py describe), accepts it (session_local_editor.py), adds the
            # clarify toolset at creation and keeps it where a session's toolsets are re-derived
            # (session_policy.py current_toolsets, session_policy_refresh.py resume refresh), all
            # through gateway/lazurio_editor_clarify.py.
            # acp: a turn's commands see the LAZURIO_BUDDY_CHANNEL of the ACP viewer that submitted
            # it (listed below too): describe advertises its capability and submission forwards the
            # prompt.submit field to admission.
            gateway/session_controls.py
            gateway/session_local_editor.py
            gateway/session_policy.py
            gateway/session_policy_refresh.py
            # acp: a session whose editor passes MCP servers reaches the configured ones too: every MCP
            # tool's handler and availability check are registered through
            # tools/lazurio_mcp_session_scope.py, so a configured server's tool is checked and runs
            # without the editor session's tool scope.
            tools/mcp_tool_registration.py
            # acp: a turn's commands see the LAZURIO_BUDDY_CHANNEL of the ACP viewer that submitted
            # it, all through gateway/lazurio_buddy_channel.py. The prompt.submit contract declares
            # the field (tui_gateway/contracts/canonical_sessions.py; apps/shared/src/gateway-contract.*
            # are its regenerated TypeScript and OpenRPC), _submit commits it with the admission
            # (session_authority.py), a local session's claim accepts it as its viewer's input
            # (session_operator.py LOCAL_INPUT_FIELDS), execute_finite_admission scopes it to that
            # admission (session_finite.py), _hmwa_prepare_turn binds it for the admission's own turn
            # (run_turn_prepare.py), the session context declares it in _VAR_MAP and unsets it on
            # every new or cleared binding (session_context.py), and the bash snapshot never keeps it
            # (tools/environments/base_session_env.py).
            apps/shared/src/gateway-contract.generated.ts
            apps/shared/src/gateway-contract.openrpc.json
            gateway/run_turn_prepare.py
            gateway/session_authority.py
            gateway/session_context.py
            gateway/session_finite.py
            gateway/session_operator.py
            tools/environments/base_session_env.py
            tui_gateway/contracts/canonical_sessions.py
            # oauth: a sign-in the 15-minute sweep removes can no longer save its tokens:
            # _gc_oauth_sessions marks a still-pending session cancelled before it removes it, under
            # the lock every poller's final check-and-save holds, and _drop_oauth_session marks the
            # session it forgets.
            # oauth: whether the signed-in ChatGPT account may run the configured model (listed below
            # too): GET /api/providers/oauth/openai-codex/entitlement answers with the entitlement()
            # of gateway/lazurio_codex_entitlement.py.
            hermes_cli/web_routers/oauth.py
            # oauth: identify names the sign-in cancel contract, and a stopping gateway keeps it:
            # publish_gateway_runtime_ready lists the CAPABILITY of gateway/lazurio_oauth_contract.py
            # among the ready capabilities, and release_gateway_runtime_lock closes the reservations
            # through its close_process_ownership, which first ends the dashboard sign-ins still
            # pending and keeps the reservations while a save still runs.
            # pairing: a configured text replaces the reply that gives an unknown sender its code
            # (listed below too): publish_gateway_runtime_ready also lists the CAPABILITY of
            # gateway/lazurio_pairing_message.py.
            # oauth: whether the signed-in ChatGPT account may run the configured model:
            # publish_gateway_runtime_ready also lists the CAPABILITY of
            # gateway/lazurio_codex_entitlement.py.
            gateway/run_runtime.py
            gateway/status.py
            # pairing: a configured text replaces the reply that gives an unknown sender its code:
            # _hm_offer_pairing_code sends the reply of gateway/lazurio_pairing_message.py where
            # config.yaml sets one, and upstream's otherwise.
            # gateway: a message that arrives while Buddy works steers his running turn by default
            # (listed below too): _hm_busy_telegram_grace_queue asks grace_holds of
            # gateway/lazurio_busy_default.py, so a steer-mode text skips the post-start grace window.
            gateway/run_inbound.py
            # oauth: whether the signed-in ChatGPT account may run the configured model: inside
            # reads_only() of hermes_cli/lazurio_auth_store_reads.py, _load_auth_store reads a store it
            # cannot parse as empty without writing the auth.json.corrupt copy, since no save follows
            # that read; every other read keeps upstream's copy.
            hermes_cli/auth.py
            # gateway: a message that arrives while Buddy works steers his running turn by default:
            # _load_busy_input_mode falls back to BUSY_INPUT_DEFAULT of gateway/lazurio_busy_default.py
            # where neither the environment nor config.yaml names a mode. Upstream's test of the
            # interrupt path names the mode it tests instead of relying on the default.
            gateway/run_config_loaders.py
            tests/gateway/test_busy_photo_interrupt_once.py
          )
          # Deleting an upstream file, renaming one (with rename detection off, a rename is a
          # deletion plus a new file) or changing its type always fails, allowlisted or not.
          removed="$(git diff --name-status --no-renames --diff-filter=DT "$UPSTREAM_SHA..HEAD")"
          if [ -n "$removed" ]; then
            echo "The overlay deleted, renamed or retyped upstream files:" >&2
            echo "$removed" >&2
            exit 1
          fi
          unexpected="$(git diff --name-only --no-renames --diff-filter=M "$UPSTREAM_SHA..HEAD" |
            grep -vxF -f <(printf '%s\n' ${allowed_upstream_changes[@]+"${allowed_upstream_changes[@]}"}) || true)"
          if [ -n "$unexpected" ]; then
            echo "The overlay changed upstream files outside allowed_upstream_changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Upstream workflows stay disabled
        if: github.repository == 'Lazurio/hermes-agent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | select(.path | test("^\\.github/workflows/lazurio-") | not) | .path')"
          if [ -n "$active" ]; then
            echo "Upstream workflows are enabled in this fork; disable them (runbook: Automation boundary):" >&2
            echo "$active" >&2
            exit 1
          fi

      - name: Validate the Lazurio release contract
        run: python3 scripts/lazurio_fork_contract_test.py -v

  # Upstream's locked toolchain and upstream's runner (one process per test file) over a fixed gate
  # plus every test file the overlay adds or changes. The gate holds upstream's tests of the seams the
  # overlay touches; a gate path that disappears fails the step, so a rebuild reviews the gate.
  tests:
    name: Upstream and overlay tests
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact source and upstream base without credentials
        run: |
          set -euo pipefail
          git init -q .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --quiet --filter=blob:none --no-tags source "$SOURCE_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --quiet --filter=blob:none --no-tags upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"

      - name: Set up upstream's locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["acp"]'
          test-environment: 'true'

      - name: Test the gate and what the overlay adds or changes
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          # The fixed gate: upstream's ACP adapter tests (the seams of the ACP overlay rows, with
          # upstream's real gateway and ACP stdio tests), upstream's check of every workflow's job
          # graph and triggers, which reads the lazurio-* workflows too, upstream's tests of the
          # owner's session-scoped fast control the fast mode row runs and reads (config.set and
          # config.get fast on a real gateway), upstream's tests of the
          # session policy seams the clarify row touches (creation, editor policy, follow-profile,
          # resume refresh, the runtime descriptor), upstream's tests of the MCP registration,
          # availability and call seams the configured-MCP row touches (session scopes, trust, lazy
          # start, multiplexed connection keys, the schema cache, the registry's checked tool list and
          # the Tool Search catalog built from it), upstream's tests of the seams the channel row
          # touches (per-turn admission fields, a local session's claim and its turn, the session
          # context and its env bridge, the bash snapshot, the generated wire contract), and upstream's
          # tests of the dashboard sign-in seams the OAuth sweep row touches (the routes and pollers,
          # the Codex worker, a dropped start, the free-tier sign-in and the setup metric a session
          # settles), and upstream's tests of the runtime seams the identify row touches (the ready
          # descriptor and the strict identify reader, and the runtime lock's release on every way
          # out: the stop of a real gateway process, an early exit, the exit backstop and the shutdown
          # watchdog), and upstream's tests of the reply seam the pairing row touches (the code's reply
          # off the event loop and what an unknown sender is told), upstream's tests of the auth
          # store loader the entitlement row touches (a store that cannot be read or parsed, and its
          # encoding), and upstream's tests of the busy-input seams the busy default row touches (the
          # mode /busy writes and reports, a routed profile's own mode, and the steer, queue and
          # interrupt paths of a message that arrives while a turn runs).
          gate=(
            tests/acp_adapter
            tests/ci/test_workflow_job_graph.py
            tests/gateway/test_authority_busy_preempt_parity.py
            tests/gateway/test_bootstrap_early_exit_teardown.py
            tests/gateway/test_busy_command.py
            tests/gateway/test_busy_session_ack.py
            tests/gateway/test_busy_steer_origin.py
            tests/gateway/test_claim_reopen_off_loop.py
            tests/gateway/test_delegation_session_id_leak.py
            tests/gateway/test_display_admission.py
            tests/gateway/test_follow_profile_followups.py
            tests/gateway/test_gateway_process_exit.py
            tests/gateway/test_kanban_finite_admission.py
            tests/gateway/test_local_context_ref_turn_text.py
            tests/gateway/test_local_turn_origin_execute_code_gate.py
            tests/gateway/test_local_viewer_events_submit.py
            tests/gateway/test_multiplex_busy_input_mode.py
            tests/gateway/test_normal_runtime_boot.py
            tests/gateway/test_pairing_reply_off_loop.py
            tests/gateway/test_pending_steer_drain.py
            tests/gateway/test_runtime_bootstrap_lifecycle.py
            tests/gateway/test_runtime_describe_skin.py
            tests/gateway/test_runtime_ownership.py
            tests/gateway/test_runtime_token_identity.py
            tests/gateway/test_session_context_inheritance.py
            tests/gateway/test_session_edit_policy.py
            tests/gateway/test_session_env.py
            tests/gateway/test_session_follow_profile_config.py
            tests/gateway/test_session_policy.py
            tests/gateway/test_session_policy_coding_posture.py
            tests/gateway/test_session_policy_refusal_fields.py
            tests/gateway/test_session_resume_config_refresh.py
            tests/gateway/test_session_tui_config.py
            tests/gateway/test_shutdown_runtime_ownership.py
            tests/gateway/test_shutdown_watchdog.py
            tests/gateway/test_status.py
            tests/gateway/test_steer_command.py
            tests/gateway/test_surface_admission.py
            tests/gateway/test_tui_busy_default.py
            tests/gateway/test_unauthorized_sender_notices.py
            tests/hermes_cli/test_anon_desktop_signin.py
            tests/hermes_cli/test_auth_store_read_failure.py
            tests/hermes_cli/test_auth_store_windows_encoding.py
            tests/hermes_cli/test_gateway_runtime.py
            tests/hermes_cli/test_gateway_runtime_discovery.py
            tests/hermes_cli/test_native_profile_scope_threads.py
            tests/hermes_cli/test_shared_metrics_signals.py
            tests/hermes_cli/test_web_oauth_dispatch.py
            tests/hermes_cli/web_routers/test_codex_device_login_transient_retry.py
            tests/tools/test_local_env_session_leak.py
            tests/tools/test_mcp_lazy_start.py
            tests/tools/test_mcp_multiplex_connection_keys.py
            tests/tools/test_mcp_schema_cache.py
            tests/tools/test_mcp_session_scope.py
            tests/tools/test_mcp_tool.py
            tests/tools/test_mcp_trust_gating.py
            tests/tools/test_registry.py
            tests/tools/test_snapshot_multiline_session_env_injection.py
            tests/tools/test_snapshot_session_id_leak.py
            tests/tools/test_tool_search.py
            tests/tui_gateway/contracts/test_generated.py
          )
          paths=()
          for path in "${gate[@]}"; do
            if [ -z "$(git ls-files -- "$path" | grep -E '(^|/)test_[^/]*\.py$' || true)" ]; then
              echo "The test gate's $path is gone or holds no tests." >&2
              exit 1
            fi
            paths+=("$path")
          done
          # Test files the overlay adds or changes, outside the gate's directories.
          while IFS= read -r file; do
            covered=false
            for path in "${gate[@]}"; do
              case "$file" in "$path" | "$path"/*) covered=true ;; esac
            done
            if [ "$covered" = false ]; then paths+=("$file"); fi
          done < <(git diff --name-only --diff-filter=d "$UPSTREAM_SHA..HEAD" -- 'tests/*.py' |
            grep -E '(^|/)test_[^/]*\.py$' || true)
          printf 'Testing:\n'
          printf '  %s\n' "${paths[@]}"
          scripts/run_tests.sh "${paths[@]}"
