name: Contributor Attribution Check

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review status objects"
        value: ${{ jobs.check-attribution.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.check.outputs.review_status }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Check repository maintenance contract
        id: check
        shell: bash
        run: |
          set +e
          case "$GITHUB_REPOSITORY" in
            NousResearch/hermes-agent)
              SOURCE="contributor attribution"
              python3 scripts/audit_pr_attribution.py
              RC=$?
              ;;
            Lazurio/hermes-agent)
              SOURCE="Lazurio fork provenance"
              python3 fork-maintenance/audit_overlay.py
              RC=$?
              ;;
            *)
              SOURCE="repository identity"
              echo "Unsupported repository identity: $GITHUB_REPOSITORY"
              RC=1
              ;;
          esac

          if [ "$RC" -eq 0 ]; then
            echo "review_status=[]" >> "$GITHUB_OUTPUT"
            echo "review_status=[]" > review-status.json
          else
            REVIEW_STATUS=$(jq -nc \
              --arg source "$SOURCE" \
              '[{"source":$source,"results":[{"kind":"action_required","title":"Repository maintenance contract failed","summary":"The branch does not satisfy the repository-specific provenance gate.","detail":"Read the failed audit output above.","how_to_fix":"For Lazurio/hermes-agent, update fork-maintenance/patches.v1.json and keep the branch a declared overlay on a tree-neutral upstream release bridge. For NousResearch/hermes-agent, add the missing contributor mapping."}]}]')
            echo "review_status=$REVIEW_STATUS" >> "$GITHUB_OUTPUT"
            echo "review_status=$REVIEW_STATUS" > review-status.json
          fi
          exit "$RC"

      - name: Upload review status artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-contributor-check
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
